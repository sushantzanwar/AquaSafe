# Local PostgreSQL for AquaSafe's persistent application data.
# Credentials come from the repo-root .env (see .env.example); nothing is hard-coded here.
#   docker compose up -d --build     (whole stack: app on :8000 + db)
#   docker compose up -d db          (database only)
services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
      - path: backend/.env   # LLM keys (GEMINI_API_KEY / LLM_API_KEY) for the AI assistant
        required: false
    environment:
      # Inside the compose network the database host is the service name, not 127.0.0.1.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aquasafe}
      AQUASAFE_UPLOADS_DIR: /app/data/uploads
      AQUASAFE_LEGACY_DB: /data/historical_data.db   # legacy analysis history, kept across restarts
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - aquasafe_uploads:/app/data/uploads
      - aquasafe_data:/data

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aquasafe}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aquasafe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aquasafe_pgdata:
  aquasafe_data:
  aquasafe_uploads:
