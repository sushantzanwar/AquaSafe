[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aquawatch"
version = "0.1.0"
description = "Offline satellite water-quality decision support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.7",
  "pyyaml>=6",
  "numpy>=1.26",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
geo = ["rasterio>=1.4", "geopandas>=1.0", "shapely>=2.0", "xarray>=2024.9", "pyarrow>=16"]
indicators = ["qda_modelos"]
segment = ["geoai-py", "timm", "segmentation-models-pytorch"]
rag = ["faiss-cpu", "sentence-transformers", "joblib"]

[project.scripts]
aquawatch = "aquawatch.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
