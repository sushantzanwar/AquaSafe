paths:
  scenes: data/scenes
  cache: data/cache
  baselines: data/baselines/baselines.sqlite
  residuals: data/baselines/residuals.joblib
  credits: data/credits/credits.sqlite
  uploads: data/credits/uploads
  corpus: data/corpus
  models: models/s2-water-unetplusplus-efficientnet-b4

model:
  repo_id: giswqs/s2-water-unetplusplus-efficientnet-b4
  tile_size: 512
  overlap: 256
  # Weights must already be on disk. The request path never downloads them.
  allow_download: false
  ndwi_threshold: 0.0
  agreement_floor: 0.7
  model_missing_confidence: 0.55
  disagreement_confidence: 0.6

preprocess:
  swir_scale: 2
  min_valid_fraction: 0.4
  pixel_area_m2: 100

anomaly:
  sigma_threshold: 3
  min_baseline_samples: 8
  z_cap: 6
  weights:
    extent: 0.25
    turbidity: 0.4
    chlorophyll: 0.35

credits:
  # Verified field contributions (backend/db/credit_rules.py reads this block; every value is optional).
  award: 10                    # legacy, unused by the verified-contribution flow
  award_high_quality: 100      # new water body + valid evidence + high quality
  award_acceptable_quality: 50 # new water body + valid evidence + acceptable quality
  require_metadata: false      # temporary: photos without GPS/time are scanned but skip location/age checks
  max_photo_age_days: 7
  duplicate_distance_m: 25     # same-place repeat radius
  duplicate_seconds: 3600      # same-observation repeat window
  phash_max_distance: 6        # perceptual-hash Hamming distance treated as "same photo"
  max_location_distance_m: 150 # photo GPS must be within this of the water-body outline
  assumed_utc_offset_minutes: 330  # for photos whose EXIF has no time zone (IST)
  rewards:                     # credit cost of each unlock; available=false means the feature is not built yet
    detailed_analysis:  {cost: 500,  available: false}
    historical_quality: {cost: 1000, available: false}
    monitoring_alerts:  {cost: 1500, available: false}
    advanced_report:    {cost: 2000, available: false}
    partner_reward:     {cost: 5000, available: false}
  severity_bump: 0.15
  severity_bump_cap: 0.45
  demo_user: demo-user

api:
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

disclaimer: >
  AquaWatch reports relative satellite indicators for decision support.
  They are not laboratory measurements. Ground sampling and lab verification
  are required before any operational or public-health decision.
